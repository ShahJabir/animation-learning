<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animation</title>
  </head>
  <body>
    <div id="app">
      <div class="carousel-scene">
        <div class="carousel">
          <div class="carousel-items" style="--i: 0">
            <img src="./src/assets/1.avif" alt="Image 1" />
          </div>
          <div class="carousel-items" style="--i: 1">
            <img src="./src/assets/2.avif" alt="Image 2" />
          </div>
          <div class="carousel-items" style="--i: 2">
            <img src="./src/assets/3.avif" alt="Image 3" />
          </div>
          <div class="carousel-items" style="--i: 3">
            <img src="./src/assets/4.avif" alt="Image 4" />
          </div>
          <div class="carousel-items" style="--i: 4">
            <img src="./src/assets/5.avif" alt="Image 5" />
          </div>
          <div class="carousel-items" style="--i: 5">
            <img src="./src/assets/6.avif" alt="Image 6" />
          </div>
          <div class="carousel-items" style="--i: 6">
            <img src="./src/assets/7.avif" alt="Image 7" />
          </div>
          <div class="carousel-items" style="--i: 7">
            <img src="./src/assets/8.avif" alt="Image 8" />
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
